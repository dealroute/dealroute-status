name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  uptime:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
    steps:
      - uses: actions/checkout@v4
      - uses: upptime/uptime-monitor@v1.43.15
        with:
          token: ${{ secrets.GH_PAT || github.token }}
